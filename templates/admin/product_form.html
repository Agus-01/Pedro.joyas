<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ 'Editar' if product else 'Nuevo' }} Producto – Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0a; color: #f7f4ef; padding: 2rem; }
        .card { max-width: 640px; margin: 0 auto; background: #111; border: 1px solid rgba(210,157,60,0.25); border-radius: 24px; padding: 2rem; }
        h1 { color: #f1c66a; margin-bottom: 1.5rem; }
        label { display: block; color: #ccc; margin-bottom: 0.4rem; font-size: 0.9rem; }
        input, textarea, select { width: 100%; padding: 0.9rem 1rem; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #fff; margin-bottom: 1.2rem; font-family: inherit; }
        textarea { min-height: 80px; resize: vertical; }
        .btn { padding: 0.9rem 2rem; border-radius: 999px; border: none; background: linear-gradient(135deg,#dac47d,#f1c66a); color: #111; font-weight: 700; cursor: pointer; }
        .btn-back { background: rgba(255,255,255,0.06); color: #fff; border: 1px solid rgba(255,255,255,0.12); margin-right: 1rem; text-decoration: none; padding: 0.9rem 2rem; border-radius: 999px; }
        .variant-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; align-items: end; }
        small { color: #888; font-size: 0.8rem; display: block; margin-top: -1rem; margin-bottom: 1rem; }
        .check-wrap { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.2rem; }
        .check-wrap input { width: auto; margin: 0; }
    </style>
</head>
<body>
<div class="card">
    <h1>{{ 'Editar producto' if product else 'Nuevo producto' }}</h1>

    <form method="POST">
        <label>Nombre</label>
        <input name="name" type="text" required value="{{ product.name if product else '' }}" />

        <label>Descripción</label>
        <textarea name="description">{{ product.description if product else '' }}</textarea>

        <label>Categoría (slug)</label>
        <select name="category">
            <option value="anillos"  {{ 'selected' if product and product.category == 'anillos' }}>anillos</option>
            <option value="pulseras" {{ 'selected' if product and product.category == 'pulseras' }}>pulseras</option>
            <option value="collares" {{ 'selected' if product and product.category == 'collares' }}>collares</option>
            <option value="combos"   {{ 'selected' if product and product.category == 'combos' }}>combos</option>
        </select>

        <label>Categoría (etiqueta visible)</label>
        <input name="category_label" type="text" required value="{{ product.category_label if product else '' }}" placeholder="Anillos" />

        <label>Precio original ($)</label>
        <input name="price" type="number" step="0.01" required value="{{ product.original_price if product else '' }}" />
        <small>El precio con 20% de descuento se calcula automáticamente.</small>

        <label>URL de imagen</label>
        <input name="image" type="text" value="{{ product.image if product else '' }}" placeholder="/static/images/mi-producto.jpg" />

        {% if product %}
            <div class="check-wrap">
                <input type="checkbox" name="active" id="active" {{ 'checked' if product.active }}>
                <label for="active" style="margin:0">Producto activo</label>
            </div>

            <label>Stock por talle</label>
            {% for v in product.variants %}
            <div class="variant-row">
                <div>
                    <label>Talle: {{ v.size }}</label>
                    <input type="number" name="stock_{{ v.id }}" value="{{ v.stock }}" min="0" />
                </div>
            </div>
            {% endfor %}
        {% else %}
            <label>Talles (separados por coma)</label>
            <input name="sizes" type="text" placeholder="12,14,16,18 o S,M,L o 40cm,45cm" />

            <label>Stock por talle (mismo orden, separados por coma)</label>
            <input name="stocks" type="text" placeholder="10,10,10,10" />
        {% endif %}

        <div style="margin-top:1rem">
            <a href="/admin" class="btn-back">← Volver</a>
            <button type="submit" class="btn">{{ 'Guardar cambios' if product else 'Crear producto' }}</button>
        </div>
    </form>
</div>
</body>
</html>
