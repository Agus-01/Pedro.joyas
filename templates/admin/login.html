<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin – Pedro Joyas</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0a; color: #f7f4ef; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { width: min(400px,100%); background: #111; border: 1px solid rgba(210,157,60,0.3); border-radius: 24px; padding: 2.5rem; }
        h1 { color: #f1c66a; margin-bottom: 0.5rem; }
        p { color: #888; margin-bottom: 2rem; font-size: 0.9rem; }
        label { display: block; color: #ccc; margin-bottom: 0.4rem; font-size: 0.9rem; }
        input { width: 100%; padding: 0.9rem 1rem; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #fff; margin-bottom: 1.2rem; }
        button { width: 100%; padding: 1rem; border-radius: 999px; border: none; background: linear-gradient(135deg,#dac47d,#f1c66a); color: #111; font-weight: 700; cursor: pointer; }
        .error { background: rgba(255,80,80,0.12); border: 1px solid rgba(255,80,80,0.3); color: #f87171; padding: 0.8rem; border-radius: 10px; margin-bottom: 1rem; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔐 Panel Admin</h1>
        <p>Pedro Joyas – Acceso restringido</p>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST">
            <label>Contraseña</label>
            <input type="password" name="password" required autofocus />
            <button type="submit">Ingresar</button>
        </form>
    </div>
</body>
</html>
